# Configuración de Alembic para ArgentGob-Mesh MVP.
[alembic]
script_location = migrations
prepend_sys_path = .
# La URL efectiva se resuelve en migrations/env.py desde DATABASE_URL.
sqlalchemy.url = postgresql+psycopg://argentgob_app:dev-password-local@localhost:5432/argentgob

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
