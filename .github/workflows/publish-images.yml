# .github/workflows/publish-images.yml
# Publica las imágenes de la demo en GHCR para que el codespace solo las
# descargue en lugar de construir 3 GB en cada arranque.
#
# Contexto: los prebuilds de Codespaces ejecutan `devcontainer up` con
# `--skip-post-create`, así que `onCreateCommand`/`postCreateCommand` NO corren
# durante el prebuild. Publicar las imágenes es la única forma de que el
# arranque sea rápido y no consuma cuota construyendo.
#
# Los runners estándar en repos públicos son gratuitos.
name: Publicar imágenes de la demo

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "containers/**"
      - "pyproject.toml"
      - "data/**"
      - "policies/**"
      - "prompts/**"
      - "migrations/**"
      - "alembic.ini"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dashboard
            dockerfile: containers/dashboard.Containerfile
          - name: migrator
            dockerfile: containers/agent.Containerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar nombre de imagen
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${OWNER}/argentgob-demo-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
